name: Blender Video Render

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender

      - name: Ensure Camera & Render Settings
        run: |
          cat <<'PYEOF' > /tmp/prep_scene.py
          import bpy, math
          scene = bpy.context.scene
          if scene.camera is None:
              bpy.ops.object.camera_add(location=(5.0, -5.0, 3.5))
              cam = bpy.context.active_object
              cam.rotation_euler = (math.radians(65), 0.0, math.radians(45))
              scene.camera = cam
          if not any(o.type == "LIGHT" for o in scene.objects):
              bpy.ops.object.light_add(type="SUN", location=(4.0, -4.0, 6.0))
              bpy.context.active_object.data.energy = 3.0
          meshes = [o for o in scene.objects if o.type == "MESH"]
          if meshes and not meshes[0].animation_data:
              obj = meshes[0]
              obj.rotation_euler = (0.0, 0.0, 0.0)
              obj.keyframe_insert(data_path="rotation_euler", frame=1)
              obj.rotation_euler = (0.0, 0.0, math.radians(360))
              obj.keyframe_insert(data_path="rotation_euler", frame=30)
          scene.render.engine = "CYCLES"
          scene.cycles.device = "CPU"
          scene.cycles.samples = 16
          scene.render.resolution_x = 640
          scene.render.resolution_y = 360
          scene.frame_start = 1
          scene.frame_end = 30
          bpy.ops.wm.save_mainfile()
          PYEOF
          sed -i "s/^          //" /tmp/prep_scene.py
          blender -b project.blend --python /tmp/prep_scene.py

      - name: Render Animation
        run: |
          mkdir -p output
          blender -b project.blend             -o //output/frame_             -F PNG             -a

      - name: Convert Frames to MP4
        run: |
          sudo apt-get install -y ffmpeg
          ffmpeg -framerate 30             -i output/frame_%04d.png             -c:v libx264             -pix_fmt yuv420p             output/video.mp4

      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: blender-video
          path: output/video.mp4

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -f output/video.mp4 ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo"               -F chat_id="${TELEGRAM_CHAT_ID}"               -F video=@"output/video.mp4"               -F caption="Blender Video Render selesai! ${RUN_URL}"
          else
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"               -d chat_id="${TELEGRAM_CHAT_ID}"               --data-urlencode "text=Blender Video Render gagal (${{ job.status }}). Cek log: ${RUN_URL}"
          fi
